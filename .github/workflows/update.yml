name: Update Liquidation Levels

on:
  schedule:
    - cron: '*/30 * * * *'  # co 30 minut
  workflow_dispatch:         # mozna uruchomic recznie

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python fetch_liq_levels.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add liq_levels.json
          git diff --staged --quiet || git commit -m "Update liq levels $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
